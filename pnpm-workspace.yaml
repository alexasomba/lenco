autoInstallPeers: false
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
  '@google/genai': true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.58.0'
  - '@modelcontextprotocol/sdk@1.30.1'
  - '@orpc/client@1.15.4'
  - '@orpc/contract@1.15.4'
  - '@orpc/interop@1.15.4'
  - '@orpc/json-schema@1.15.4'
  - '@orpc/openapi-client@1.15.4'
  - '@orpc/openapi@1.15.4'
  - '@orpc/server@1.15.4'
  - '@orpc/shared@1.15.4'
  - '@orpc/standard-server-aws-lambda@1.15.4'
  - '@orpc/standard-server-fastify@1.15.4'
  - '@orpc/standard-server-fetch@1.15.4'
  - '@orpc/standard-server-node@1.15.4'
  - '@orpc/standard-server-peer@1.15.4'
  - '@orpc/standard-server@1.15.4'
  - '@orpc/tanstack-query@1.15.4'
  - '@orpc/zod@1.15.4'
  - prettier@3.9.9
  - wrangler@4.137.0
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
